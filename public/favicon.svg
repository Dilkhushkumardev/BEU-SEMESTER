<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0B1220" stroke="url(#spGrad)" stroke-width="2.5" />
  
  <!-- Circuit Nodes & Grid Lines -->
  <circle cx="16" cy="16" r="2" fill="#06b6d4" opacity="0.8" />
  <circle cx="48" cy="48" r="2" fill="#3b82f6" opacity="0.8" />
  <path d="M16 16 L22 22 M48 48 L42 42" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- Graduation Cap Top Element -->
  <polygon points="32,13 46,19 32,25 18,19" fill="url(#spGrad)" filter="url(#glow)"/>
  <path d="M42 21 L42 27 C42 27 44 30 46 30" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Letters S & P stylised -->
  <text x="32" y="46" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#38bdf8">S</tspan><tspan fill="#a855f7">P</tspan>
  </text>
  
  <!-- Digital Core Dot -->
  <circle cx="32" cy="53" r="1.5" fill="#06b6d4" />
</svg>